version: '3.9'

services:
  # React Frontend - Nginx
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    container_name: alphasignal-web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - alphasignal
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - web_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Node.js Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    container_name: alphasignal-api
    restart: always
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alphasignal
    volumes:
      - ./apps/api/prisma:/app/apps/api/prisma:ro
      - api_logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Python Celery Worker
  analytics-worker:
    build:
      context: ./apps/analytics
      dockerfile: Dockerfile.prod
    container_name: alphasignal-worker
    restart: always
    command: celery -A src.celery_app worker --loglevel=info --concurrency=2 --queues=ingestion,llm,default
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alphasignal
    volumes:
      - worker_logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.celery_app inspect ping || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  # Celery Beat Scheduler
  analytics-beat:
    build:
      context: ./apps/analytics
      dockerfile: Dockerfile.prod
    container_name: alphasignal-beat
    restart: always
    command: celery -A src.celery_app beat --loglevel=info
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alphasignal
    volumes:
      - beat_logs:/app/logs
      - ./scripts/backup-db.sh:/scripts/backup-db.sh:ro
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    # Only run 1 instance of beat scheduler
    deploy:
      replicas: 1

  # PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: alphasignal-postgres
    restart: always
    environment:
      - POSTGRES_USER=alphasignal
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-alphasignal_prod_password}
      - POSTGRES_DB=alphasignal
      - POSTGRES_INITDB_ARGS=-E UTF8 --locale=en_US.UTF-8
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=100
      - -c
      - work_mem=4MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - min_wal_size=1GB
      - -c
      - max_wal_size=4GB
    expose:
      - "5432"
    networks:
      - alphasignal
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
      - ./scripts/init-production.sh:/docker-entrypoint-initdb.d/init-production.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphasignal -d alphasignal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: alphasignal-redis
    restart: always
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "900 1"
      - --save
      - "300 10"
      - --save
      - "60 10000"
    expose:
      - "6379"
    networks:
      - alphasignal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  alphasignal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  redis_data:
    driver: local
  web_logs:
    driver: local
  api_logs:
    driver: local
  worker_logs:
    driver: local
  beat_logs:
    driver: local
