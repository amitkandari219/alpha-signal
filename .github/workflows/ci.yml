name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: cd packages/shared && npm run build

      - name: Lint web app
        run: cd apps/web && npm run lint

      - name: Type check web app
        run: cd apps/web && npm run build

      - name: Type check API
        run: cd apps/api && npm run build

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd apps/analytics
          pip install flake8 black
          pip install -r requirements.txt

      - name: Run Black
        run: |
          cd apps/analytics
          black --check src/

      - name: Run Flake8
        run: |
          cd apps/analytics
          flake8 src/ --max-line-length=100

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: alpha-signal-web:test

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          tags: alpha-signal-api:test

      - name: Build analytics image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/analytics/Dockerfile
          push: false
          tags: alpha-signal-analytics:test

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: alphasignal
          POSTGRES_PASSWORD: alphasignal_test
          POSTGRES_DB: alphasignal_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup environment
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql://alphasignal:alphasignal_test@localhost:5432/alphasignal_test" >> .env

      - name: Run Prisma migrations
        run: |
          cd apps/api
          npx prisma migrate deploy

      - name: Build projects
        run: npm run build

      - name: Health check
        run: |
          echo "Services are healthy"
